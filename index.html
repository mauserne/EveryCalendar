<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>모임 일정 조율</title>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px 60px;
            padding-bottom: 20vh;
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
            color: #333;
            margin-bottom: 24px;
            letter-spacing: -0.3px;
        }

        .wrapper {
            display: flex;
            gap: 16px;
            align-items: flex-start;
            width: 100%;
            max-width: 900px;
        }

        /* ── Main card ── */
        .container {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            flex: 1;
            min-width: 0;
        }

        /* ── Login ── */
        .login-section {
            margin-bottom: 16px;
        }

        .login-row {
            display: flex;
            gap: 6px;
        }

        #userName {
            flex: 1;
            padding: 9px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }

        #userName:focus {
            border-color: #4a90e2;
        }

        .btn {
            padding: 9px 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            font-family: inherit;
            transition: opacity 0.15s, transform 0.1s;
        }

        .btn:hover {
            opacity: 0.85;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-load {
            background: #6c757d;
            color: white;
        }

        .btn-save {
            width: 100%;
            padding: 12px;
            margin-top: 16px;
            background: #36a1ff;
            color: white;
            font-size: 15px;
            border-radius: 8px;
        }

        .status-msg {
            font-size: 12px;
            color: #888;
            margin-top: 5px;
            min-height: 16px;
        }

        .status-msg.ok {
            color: #28a745;
        }

        .status-msg.err {
            color: #dc3545;
        }

        /* ── Calendar header ── */
        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .calendar-header h3 {
            font-size: 16px;
            color: #333;
        }

        .nav-btn {
            width: 30px;
            height: 30px;
            border: 1px solid #ddd;
            border-radius: 50%;
            background: white;
            color: #555;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
        }

        .nav-btn:hover {
            background: #f0f7ff;
            border-color: #4a90e2;
            color: #4a90e2;
        }

        /* ── Calendar grid ── */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
            text-align: center;
        }

        .day-header {
            font-weight: 700;
            font-size: 12px;
            padding-bottom: 8px;
            color: #999;
        }

        .day-header.sun {
            color: #ff4d4d;
        }

        .day-header.sat {
            color: #4a90e2;
        }

        .day {
            aspect-ratio: 1 / 1.05;
            border: 1px solid #f0f0f0;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: border-color 0.15s, background 0.15s, transform 0.15s;
            position: relative;
            overflow: hidden;
            gap: 1px;
        }

        .day:hover {
            border-color: #4a90e2;
            background: #f0f7ff;
        }

        .day-num {
            font-size: 12px;
            font-weight: 500;
            color: #444;
            line-height: 1;
        }

        .day-num.holiday {
            color: #ff4d4d;
            font-weight: 700;
        }

        .day-num.sat {
            color: #4a90e2;
        }

        .count {
            font-size: 9px;
            color: #aaa;
            line-height: 1;
        }

        /* heat bar */
        .day-heat {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 3px;
            border-radius: 0 0 8px 8px;
            transition: background 0.3s;
        }

        .heat-1 .day-heat {
            background: rgba(74, 144, 226, 0.2);
        }

        .heat-2 .day-heat {
            background: rgba(74, 144, 226, 0.45);
        }

        .heat-3 .day-heat {
            background: rgba(74, 144, 226, 0.7);
        }

        .heat-4 .day-heat {
            background: rgba(74, 144, 226, 0.95);
        }

        /* today dot */
        .day.today .day-num::after {
            content: '';
            display: block;
            width: 3px;
            height: 3px;
            background: #4a90e2;
            border-radius: 50%;
            margin: 2px auto 0;
        }

        /* selected */
        .day.active {
            background: #4a90e2;
            border-color: #4a90e2;
            transform: scale(1.05);
            box-shadow: 0 3px 10px rgba(74, 144, 226, 0.35);
        }

        .day.active .day-num {
            color: white;
        }

        .day.active .count {
            color: rgba(255, 255, 255, 0.75);
        }

        /* green highlight */
        .day.highlight-green {
            background: #d4f5e9;
            border-color: #7ed9b3;
        }

        .day.highlight-green .day-num {
            color: #1a9f6a;
        }

        .day.highlight-green:hover {
            background: #c0f0e0;
            border-color: #4a90e2;
        }

        .day.highlight-green.active {
            background: #4a90e2;
            border-color: #4a90e2;
        }

        .day.highlight-green.active .day-num {
            color: white;
        }

        /* ── Right column ── */
        .side-col {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 230px;
            flex-shrink: 0;
        }

        .side-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            padding: 16px;
        }

        .side-card-title {
            font-size: 13px;
            font-weight: 700;
            color: #333;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 10px;
            margin-bottom: 12px;
        }

        /* Hover panel */
        .hover-date {
            font-weight: 700;
            color: #4a90e2;
            font-size: 14px;
            margin-bottom: 6px;
            min-height: 18px;
        }

        .hover-sub {
            font-size: 11px;
            color: #bbb;
            margin-bottom: 10px;
        }

        .pin-badge {
            display: none;
            font-size: 11px;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 100px;
            background: #eef4ff;
            color: #4a90e2;
            border: 1px solid #c5dcf8;
            cursor: pointer;
            float: right;
            margin-top: -2px;
        }

        .pin-badge:hover {
            background: #ddeeff;
        }

        .user-list {
            list-style: none;
            max-height: 180px;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: #e0e0e0 transparent;
        }

        .user-list::-webkit-scrollbar {
            width: 3px;
        }

        .user-list::-webkit-scrollbar-thumb {
            background: #ddd;
            border-radius: 3px;
        }

        .user-list li {
            padding: 7px 8px;
            border-bottom: 1px solid #f5f5f5;
            font-size: 13px;
            color: #555;
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .user-avatar {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #4a90e2;
            color: white;
            font-size: 10px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .empty-li {
            color: #bbb;
            font-size: 12px;
            text-align: center;
            padding: 14px 0;
        }

        /* Stats */
        .stats-row {
            display: flex;
            gap: 8px;
        }

        .stat-box {
            flex: 1;
            background: #f8f9fa;
            border-radius: 8px;
            padding: 10px 8px;
            text-align: center;
            border: 1px solid #eee;
        }

        .stat-val {
            font-size: 20px;
            font-weight: 700;
            color: #4a90e2;
            line-height: 1;
        }

        .stat-lbl {
            font-size: 10px;
            color: #aaa;
            margin-top: 3px;
        }

        /* Best dates */
        .best-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 7px 0;
            border-bottom: 1px solid #f5f5f5;
            font-size: 12px;
            color: #555;
        }

        .best-item:last-child {
            border-bottom: none;
        }

        .best-badge {
            font-size: 11px;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 100px;
            background: #eef4ff;
            color: #4a90e2;
        }

        .best-badge.top {
            background: #d4f5e9;
            color: #1a9f6a;
        }

        /* My chips */
        .chip-wrap {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }

        .chip {
            font-size: 11px;
            font-weight: 600;
            padding: 3px 9px;
            background: #eef4ff;
            color: #4a90e2;
            border-radius: 100px;
            border: 1px solid #c5dcf8;
        }

        /* Legend */
        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #f0f0f0;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 11px;
            color: #aaa;
        }

        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 3px;
            flex-shrink: 0;
        }

        .ld-sel {
            background: #4a90e2;
        }

        .ld-grn {
            background: #7ed9b3;
        }

        .ld-heat {
            background: linear-gradient(90deg, rgba(74, 144, 226, 0.2), rgba(74, 144, 226, 0.9));
        }

        @media (max-width: 700px) {
            .wrapper {
                flex-direction: column;
            }

            .side-col {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <h1>모임 일정 조율</h1>

    <div class="wrapper">

        <!-- ── Main calendar card ── -->
        <div class="container">

            <!-- Login -->
            <div class="login-section">
                <div class="login-row">
                    <input type="text" id="userName" placeholder="이름을 입력하세요 (예: 홍길동)" autocomplete="off">
                    <button class="btn btn-load" onclick="loadUserData()">로그인/조회</button>
                </div>
                <div id="statusMsg" class="status-msg"></div>
            </div>

            <!-- Calendar header -->
            <div class="calendar-header">
                <button class="nav-btn" onclick="changeMonth(-1)">&#8592;</button>
                <h3 id="monthDisplay"></h3>
                <button class="nav-btn" onclick="changeMonth(1)">&#8594;</button>
            </div>

            <!-- Grid -->
            <div id="calendar" class="calendar-grid"></div>

            <!-- Legend -->
            <div class="legend">
                <div class="legend-item">
                    <div class="legend-dot ld-sel"></div>내가 선택
                </div>
                <div class="legend-item">
                    <div class="legend-dot ld-grn"></div>페스티벌 일정
                </div>
                <div class="legend-item">
                    <div class="legend-dot ld-heat"></div>참여 많을수록 진함
                </div>
            </div>

            <button class="btn btn-save" onclick="saveData()">저장하기</button>
        </div>

        <!-- ── Right column ── -->
        <div class="side-col">

            <!-- Stats -->
            <div class="side-card">
                <div class="side-card-title">현황</div>
                <div class="stats-row">
                    <div class="stat-box">
                        <div class="stat-val" id="statMyCount">0</div>
                        <div class="stat-lbl">내 선택 날</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-val" id="statMaxUsers">0</div>
                        <div class="stat-lbl">최대 인원</div>
                    </div>
                </div>
            </div>

            <!-- TOP 3 -->
            <div class="side-card">
                <div class="side-card-title">🏆 인원 많은 날 TOP 3</div>
                <div id="bestDatesList">
                    <div class="empty-li">데이터를 불러오세요</div>
                </div>
            </div>

            <!-- Hover / pin panel -->
            <div class="side-card">
                <div class="side-card-title">
                    날짜별 참여자
                    <span class="pin-badge" id="pinBadge" onclick="unpinDate()">📌 고정됨 ×</span>
                </div>
                <div id="hoverDateTitle" class="hover-date">—</div>
                <div id="hoverDateSub" class="hover-sub">날짜에 마우스를 올려보세요</div>
                <ul id="userList" class="user-list">
                    <li class="empty-li">—</li>
                </ul>
            </div>

            <!-- My selected dates -->
            <div class="side-card">
                <div class="side-card-title">내 선택 날짜</div>
                <div id="myDatesList">
                    <div class="empty-li">선택된 날짜가 없습니다</div>
                </div>
            </div>

        </div>
    </div>

    <script>
        const HOLIDAYS_2026 = new Set([
            '2026-1-1', '2026-2-14', '2026-2-16', '2026-2-17', '2026-2-18',
            '2026-3-1', '2026-3-2', '2026-5-1', '2026-5-5', '2026-5-24', '2026-5-25',
            '2026-6-3', '2026-6-6', '2026-7-17', '2026-8-15', '2026-8-17',
            '2026-9-24', '2026-9-25', '2026-9-26', '2026-10-3', '2026-10-5',
            '2026-10-9', '2026-12-25',
        ]);

        const GREEN_DATES = new Set([
            '2026-7-25', '2026-7-26', '2026-7-31',
            '2026-8-1', '2026-8-2',
            '2026-9-5', '2026-9-6',
            '2026-10-2', '2026-10-3', '2026-10-4',
        ]);

        let usersByDate = {};
        let mySelectedDates = new Set();
        let currentYear = new Date().getFullYear();
        let currentMonth = new Date().getMonth();
        let currentUserName = "";
        let isLoaded = false;
        let pinnedDate = null;

        const today = new Date();

        function renderCalendar() {
            const calEl = document.getElementById('calendar');
            calEl.innerHTML = '';
            document.getElementById('monthDisplay').innerText =
                `${currentYear}. ${String(currentMonth + 1).padStart(2, '0')}`;

            ['일', '월', '화', '수', '목', '금', '토'].forEach((d, i) => {
                const cls = i === 0 ? 'sun' : i === 6 ? 'sat' : '';
                calEl.innerHTML += `<div class="day-header ${cls}">${d}</div>`;
            });

            const firstDay = new Date(currentYear, currentMonth, 1).getDay();
            const lastDate = new Date(currentYear, currentMonth + 1, 0).getDate();
            const maxUsers = Math.max(1, ...Object.values(usersByDate).map(u => u.length));

            for (let i = 0; i < firstDay; i++) calEl.innerHTML += '<div></div>';

            for (let d = 1; d <= lastDate; d++) {
                const dateStr = `${currentYear}-${currentMonth + 1}-${d}`;
                const users = usersByDate[dateStr] || [];
                const isActive = mySelectedDates.has(dateStr);
                const isHoliday = HOLIDAYS_2026.has(dateStr);
                const isGreen = GREEN_DATES.has(dateStr);
                const isToday = d === today.getDate() && currentMonth === today.getMonth() && currentYear === today.getFullYear();
                const dow = new Date(currentYear, currentMonth, d).getDay();

                let numCls = '';
                if (isHoliday || dow === 0) numCls = 'holiday';
                else if (dow === 6) numCls = 'sat';

                const ratio = users.length / maxUsers;
                let heatCls = '';
                if (!isActive && users.length > 0) {
                    if (ratio < 0.25) heatCls = ' heat-1';
                    else if (ratio < 0.50) heatCls = ' heat-2';
                    else if (ratio < 0.75) heatCls = ' heat-3';
                    else heatCls = ' heat-4';
                }

                let cls = 'day';
                if (isActive) cls += ' active';
                if (isGreen && !isActive) cls += ' highlight-green';
                if (isToday) cls += ' today';
                cls += heatCls;

                const dayEl = document.createElement('div');
                dayEl.className = cls;
                dayEl.innerHTML = `<span class="day-num ${numCls}">${d}</span><span class="count">${users.length > 0 ? users.length + '명' : ''}</span><div class="day-heat"></div>`;
                dayEl.onclick = () => { toggleDate(dateStr, dayEl); pinDate(dateStr); };
                dayEl.onmouseenter = () => { if (!pinnedDate) updateSidePanel(dateStr); };
                dayEl.onmouseleave = () => { if (!pinnedDate) clearSidePanel(); };
                calEl.appendChild(dayEl);
            }

            updateStats();
            updateBestDates();
            updateMyDates();
        }

        function toggleDate(dateStr, el) {
            if (!isLoaded) { setStatus('이름을 입력하고 로그인/조회를 먼저 눌러주세요!', 'err'); return; }
            if (!usersByDate[dateStr]) usersByDate[dateStr] = [];
            const isGreen = GREEN_DATES.has(dateStr);

            if (mySelectedDates.has(dateStr)) {
                mySelectedDates.delete(dateStr);
                usersByDate[dateStr] = usersByDate[dateStr].filter(u => u !== currentUserName);
                el.classList.remove('active');
                if (isGreen) el.classList.add('highlight-green');
            } else {
                mySelectedDates.add(dateStr);
                if (!usersByDate[dateStr].includes(currentUserName)) usersByDate[dateStr].push(currentUserName);
                el.classList.remove('highlight-green');
                el.classList.add('active');
            }

            el.querySelector('.count').innerText = usersByDate[dateStr].length > 0 ? usersByDate[dateStr].length + '명' : '';
            if (pinnedDate === dateStr) updateSidePanel(dateStr);
            updateStats();
            updateBestDates();
            updateMyDates();
        }

        /* ── Side panel ── */
        function pinDate(dateStr) {
            pinnedDate = dateStr;
            document.getElementById('pinBadge').style.display = 'inline-block';
            updateSidePanel(dateStr);
        }

        function unpinDate() {
            pinnedDate = null;
            document.getElementById('pinBadge').style.display = 'none';
            clearSidePanel();
        }

        function updateSidePanel(dateStr) {
            const [y, m, d] = dateStr.split('-');
            const days = ['일', '월', '화', '수', '목', '금', '토'];
            const dow = new Date(+y, +m - 1, +d).getDay();
            document.getElementById('hoverDateTitle').innerText = `${m}월 ${d}일 (${days[dow]})`;
            document.getElementById('hoverDateSub').innerText = `${y}년`;

            const users = usersByDate[dateStr] || [];
            const ul = document.getElementById('userList');
            ul.innerHTML = users.length === 0
                ? '<li class="empty-li">선택한 인원이 없습니다</li>'
                : users.map(u => `<li><div class="user-avatar">${u.charAt(0)}</div>${u}</li>`).join('');
        }

        function clearSidePanel() {
            document.getElementById('hoverDateTitle').innerText = '—';
            document.getElementById('hoverDateSub').innerText = '날짜에 마우스를 올려보세요';
            document.getElementById('userList').innerHTML = '<li class="empty-li">—</li>';
        }

        /* ── Stats ── */
        function updateStats() {
            document.getElementById('statMyCount').innerText = mySelectedDates.size;
            const max = Math.max(0, ...Object.values(usersByDate).map(u => u.length));
            document.getElementById('statMaxUsers').innerText = max;
        }

        function updateBestDates() {
            const sorted = Object.entries(usersByDate)
                .filter(([, u]) => u.length > 0)
                .sort((a, b) => b[1].length - a[1].length)
                .slice(0, 3);

            const el = document.getElementById('bestDatesList');
            if (!sorted.length) { el.innerHTML = '<div class="empty-li">아직 데이터가 없습니다</div>'; return; }

            const days = ['일', '월', '화', '수', '목', '금', '토'];
            el.innerHTML = sorted.map(([ds, users], i) => {
                const [y, m, d] = ds.split('-');
                const dow = new Date(+y, +m - 1, +d).getDay();
                return `<div class="best-item">
      <span>${m}월 ${d}일 (${days[dow]})</span>
      <span class="best-badge ${i === 0 ? 'top' : ''}">${users.length}명</span>
    </div>`;
            }).join('');
        }

        function updateMyDates() {
            const el = document.getElementById('myDatesList');
            if (!mySelectedDates.size) { el.innerHTML = '<div class="empty-li">선택된 날짜가 없습니다</div>'; return; }
            const sorted = [...mySelectedDates].sort();
            el.innerHTML = `<div class="chip-wrap">${sorted.map(ds => {
                const [, m, d] = ds.split('-');
                return `<span class="chip">${m}/${d}</span>`;
            }).join('')}</div>`;
        }

        /* ── API ── */
        async function loadAllSchedules() {
            try {
                const res = await fetch('/api/get-schedule');
                if (!res.ok) throw new Error();
                usersByDate = (await res.json()).usersByDate || {};
            } catch { }
            renderCalendar();
        }

        async function loadUserData() {
            const name = document.getElementById('userName').value.trim();
            if (!name) { setStatus('이름을 먼저 입력해주세요.', 'err'); return; }
            setStatus('로그인 중...', '');
            try {
                const res = await fetch(`/api/get-schedule?name=${encodeURIComponent(name)}`);
                if (!res.ok) throw new Error();
                const data = await res.json();
                usersByDate = data.usersByDate || {};
                mySelectedDates = new Set(data.userDates || []);
            } catch { }
            currentUserName = name; isLoaded = true;
            renderCalendar();
            setStatus(`✅ ${name}님 로그인 완료`, 'ok');
        }

        async function saveData() {
            if (!isLoaded) { setStatus('로그인/조회를 먼저 해주세요.', 'err'); return; }
            const name = document.getElementById('userName').value.trim();
            if (name !== currentUserName) { setStatus('로그인한 이름과 다릅니다. 다시 로그인해주세요.', 'err'); return; }
            setStatus('저장 중...', '');
            try {
                const res = await fetch('/api/save-schedule', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user: currentUserName, dates: [...mySelectedDates] })
                });
                if (!res.ok) throw new Error();
                await loadUserData();
                setStatus('✅ 저장 완료!', 'ok');
            } catch {
                setStatus('❌ 저장 중 오류가 발생했습니다.', 'err');
            }
        }

        function changeMonth(diff) {
            currentMonth += diff;
            if (currentMonth > 11) { currentMonth = 0; currentYear++; }
            else if (currentMonth < 0) { currentMonth = 11; currentYear--; }
            renderCalendar();
        }

        function setStatus(msg, type) {
            const el = document.getElementById('statusMsg');
            el.innerText = msg;
            el.className = 'status-msg ' + (type || '');
        }

        document.getElementById('userName').addEventListener('keydown', e => {
            if (e.key === 'Enter') loadUserData();
        });

        loadAllSchedules();
    </script>
</body>

</html>
